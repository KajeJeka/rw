[[constant]]
id = "EXETBL-C025"
value = 314368
unit = "bytes"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "EXETBL-002"
note = "Section DGROUP SizeOfRawData 0x0004CC00. Raw data ends at file offset 0x11DA00, which is exactly where .idata raw data begins, so a read is bounded by its section and not only by the file: the last byte of DGROUP reads and two bytes from it do not. The highest byte any table reaches is 0xE9123; 0xE9124 is the exclusive end, one byte past anything the tables own."

# .bss: VA 0x00140000, VS 0, RawPtr 0x00000000, RawSize 0x00172C00
[[constant]]
id = "EXETBL-C026"
value = 1310720
unit = "address"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "EXETBL-002"
note = "Section .bss VirtualAddress 0x00140000, PointerToRawData 0. It contributes no file bytes and is not file-backed, because both raw fields must be nonzero and this one's is zero. Skipped rather than mapped to offset 0."

[[constant]]
id = "EXETBL-C030"
value = 1518592
unit = "bytes"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "EXETBL-002"
note = "Section .bss SizeOfRawData 0x00172C00. Nonzero, beside the zero PointerToRawData in EXETBL-C026, which is what makes file-backed a two condition test. A reader that admits .bss on its size computes file_offset = 0 + delta, so a read at 0x00540000, the first address .bss owns, returns the DOS header bytes 4D 5A as table data."

