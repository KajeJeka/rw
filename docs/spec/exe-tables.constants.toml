# Executable layer constants for `falloutw.exe`.
#
# Companion to docs/spec/exe-tables.md. Every number here was read from the
# bytes of the reference build, which is the copy of falloutw.exe in the
# reference install. Its location on any one machine is deliberately not
# written down here; the digest below identifies it.
# SHA-256 444257e5fe91e6c333261aecadacb1f46dbba0319fa0b187de89f36914f32272
# No Community Edition artefact was consulted, so no row below carries the tag
# "CONFIRMED IN COMMUNITY EDITION ONLY".
#
# These constants are TRUE FOR ONE EXACT BUILD ONLY. The digest is checked
# first; any other build stops with a clear message and never relaxes a value.
#
# The tables are read from the player's own executable at run time, or cached
# under target/. No table value is committed to this repository; the rows here
# record the shape and the oracle values that the readers must reproduce, not a
# copy of the data.

# ---------------------------------------------------------------------------
# Build gate
# ---------------------------------------------------------------------------

[[constant]]
id = "EXETBL-C001"
value = 1145198565
unit = "sha256-word-0"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "EXETBL-001"
note = "Bits 0 to 31 of the reference build SHA-256, 0x444257e5, the first four bytes of the digest. This row and C002 split the high 64 bits (C003) so a partial check can fail fast."

[[constant]]
id = "EXETBL-C002"
value = 4270974659
unit = "sha256-word-1"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "EXETBL-001"
note = "Bits 32 to 63 of the same digest, 0xfe91e6c3."

[[constant]]
id = "EXETBL-C003"
value = 4918590388372104899
unit = "sha256-high-64"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "EXETBL-001"
note = "High 64 bits of 444257e5fe91e6c333261aecadacb1f46dbba0319fa0b187de89f36914f32272."

[[constant]]
id = "EXETBL-C004"
value = 16035615580877955698
unit = "sha256-low-64"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "EXETBL-001"
note = "Low 64 bits of the same digest, 0xde89f36914f32272, its last eight bytes. With C003 this pins 16 of the digest's 32 bytes, the first eight and the last eight; the digest string in EXETBL-001 carries all 32. Checked before any header parse and before any constant is used."

[[constant]]
