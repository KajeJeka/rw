claim = "LZSS-021"
note = "MASTER.DAT blocks whose output changes when RING_FILL is 0x00 instead of 0x20. Much lower than the write index canaries because only blocks short enough to read back into the prefilled region are affected, so a prefill canary must pin short blocks by name or use a set known to contain them."

