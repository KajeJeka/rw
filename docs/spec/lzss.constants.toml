evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "LZSS-021"
note = "Length mismatches across every canary variant over LZSS-C060 plus LZSS-C061, 15,770 blocks. Every wrong write index produced the canonical byte count and only different bytes. A canary that compares lengths therefore passes on every wrong variant and proves nothing; it has to compare bytes."

[[constant]]
