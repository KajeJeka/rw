# Byte order layer constants.
#
# One row per number docs/spec/endian.md fixes. Merged into the protected
# ledger at spec/constants.toml by the test-author role.
#
# unit is "bytes" for a width, a length or an offset measured in bytes,
# "count" for a number of elements or entries, and "none" for a value that is
# neither a length nor a count.
#
# A row's evidence tag is the tag of the claim it was introduced by. Where a
# claim is a construction rule the original could not witness, the row carries
# UNVERIFIED and the note says so; implement and pin it regardless.

[[constant]]
id = "END-C001"
value = 1
unit = "bytes"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "END-014"
note = "Width of one u8 read, and of one skip or bytes call for a single byte."

[[constant]]
id = "END-C002"
value = 2
unit = "bytes"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "END-014"
note = "Width of one u16 read and of one i16 read. Also the width of the DAT block chain block header, whose big endian u16 carries the raw flag in bit 15."

[[constant]]
id = "END-C003"
value = 4
unit = "bytes"
