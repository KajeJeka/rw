evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "END-006"
note = "The XP value for level 1 read big-endian. Anti-deviation witness for the executable layer. The four bytes at virtual address 0x5082D4 are 01 00 00 00; folded most significant byte first they give exactly this value, with no error raised."

