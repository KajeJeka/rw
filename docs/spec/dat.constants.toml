# DAT archive container constants — PROTECTED file.
#
# Source of truth for docs/spec/dat.md. Every value here was re-read from the
# bytes of MASTER.DAT and CRITTER.DAT in the reference install. On any other
# install the gate reports "unsupported install"; these numbers are not relaxed.
#
# Values written as decimal and as hex are the same number. The hex form is
# there because the guide and the container bytes speak in hex.

[[constant]]
id = "DAT-C001"
value = 16
unit = "bytes"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "DAT-001"
note = "Size of the root header: four big endian u32 at 0x00. No magic, version or checksum."

[[constant]]
id = "DAT-C002"
value = 16
unit = "bytes"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "DAT-004"
note = "Size of a block header, one per directory in the same order as the names. Replaces the root header in shape only; field 0 changes meaning (DAT-C010)."

[[constant]]
id = "DAT-C003"
value = 16
unit = "bytes"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "DAT-006"
note = "Block field 2 at all 66 measured block headers. It is the byte width of the four u32 trailer of an entry, NOT the size of a whole entry record, which is 1 + name_length + 16 and varies."

[[constant]]
id = "DAT-C004"
value = 17
unit = "bytes"
evidence = "CONFIRMED AGAINST ORIGINAL BINARY"
claim = "DAT-009"
note = "Minimum entry record size: a one byte name length, an empty name, then the four u32. Included so the record length is not mistaken for the fixed 16 of DAT-C003."

