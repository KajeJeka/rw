# PROTECTED file. The constants ledger.
#
# Every number the specification fixes lives here with its id, its value, its
# evidence tag and the claim id that introduced it. A test compares each public
# constant in the code with this ledger.
#
# Evidence tags, highest trust first:
#   CONFIRMED AGAINST ORIGINAL BINARY  checked against falloutw.exe bytes or real game data
#   CONFIRMED IN COMMUNITY EDITION ONLY
#   VERSION DIFFERENCE IDENTIFIED
#   UNVERIFIED                          not enough evidence; do not guess, isolate it
#
# The ledger changes only with new evidence and an owner decision.
#
# Merged from docs/spec/endian.constants.toml, lzss.constants.toml,
# dat.constants.toml and exe-tables.constants.toml, one row per entry, sorted by
# id. Every row is copied verbatim from its fragment: a row's evidence tag is
# the tag of the claim that introduced it, and the merge never raises or lowers
# it. The four fragments already carry subsystem-prefixed ids, so the merge
# renumbers nothing. Do not hand-edit from an implementation.

