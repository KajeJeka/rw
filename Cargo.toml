# RUSTY WASTELAND workspace root.
#
# The lint table below is a PROTECTED file. Changing it needs the owner's
# approval, because every "total reader" and "explicit arithmetic" guarantee
# in the engineering philosophy is enforced from here (guide: Engineering
# philosophy, "How each principle is checked").
#
# The root package is `rw-gate`. It carries no library code. Its only purpose
# is to own `tests/gates/`, the gate tests written by the test-author role.

[workspace]
resolver = "2"
members = [
    "crates/fo1-bigendian",
    "crates/fo1-endian-host",
    "crates/fo1-lzss",
    "crates/fo1-dat",
    "crates/fo1-exe",
    "crates/fo1-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false
# SPDX has no identifier for "this project has not chosen a licence yet", which
# is the honest state. See LICENSE and the note in deny.toml.
license = "LicenseRef-Proprietary"
# The licence is an open owner decision (guide: Open items, "Project"). It is
# deliberately NOT declared here: `publish = false` means cargo never needs it,
# and declaring one we have not chosen would be worse than declaring none.

# There is deliberately no [workspace.dependencies] table. Every path dependency
# in this workspace names its path directly. cargo-deny 0.20.2 reports
# `bug[unresolved-workspace-dependency]` for a workspace-inherited path
# dependency and `error[wildcard]` for `[dependencies] foo.workspace = true`,
# both of which are tool limitations rather than real findings. Six path
# dependencies spelled out is less code than six workarounds in deny.toml.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
overflow-checks = true

[package]
name = "rw-gate"
description = "Gate-test host for RUSTY WASTELAND. Owns tests/gates/ only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "LicenseRef-Proprietary"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dev-dependencies]
fo1-bigendian = { path = "crates/fo1-bigendian" }
fo1-endian-host = { path = "crates/fo1-endian-host" }
fo1-lzss = { path = "crates/fo1-lzss" }
fo1-dat = { path = "crates/fo1-dat" }
fo1-exe = { path = "crates/fo1-exe" }
fo1-tests = { path = "crates/fo1-tests" }

# Cargo auto-discovers `tests/*.rs` but NOT `tests/gates/*.rs`, because a
# subdirectory is not a test target. Every gate test is therefore declared here.
# These entries are part of the frozen wave-0 contract: a new gate file needs a
# new [[test]] entry, which is one more place the owner must approve a change to
# when the gate grows.
[[test]]
name = "synthetic_endian"
path = "tests/gates/synthetic_endian.rs"

[[test]]
name = "synthetic_lzss"
path = "tests/gates/synthetic_lzss.rs"

[[test]]
name = "synthetic_dat"
path = "tests/gates/synthetic_dat.rs"

[[test]]
name = "install_archive"
path = "tests/gates/install_archive.rs"

[[test]]
name = "install_plaintext"
path = "tests/gates/install_plaintext.rs"

[[test]]
name = "install_exe_tables"
path = "tests/gates/install_exe_tables.rs"