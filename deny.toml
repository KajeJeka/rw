# PROTECTED file. Changing this needs the owner's approval.

[graph]
all-features = true

[licenses]
# No third party source or code ships in this repository. The allow list is
# deliberately narrow: a new licence needs the owner's approval and a line in
# docs/deps.md stating why (guide: engineering philosophy, "Few dependencies").
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    # The workspace's own seven crates. Every manifest declares MIT, which the
    # owner chose for our own code. See LICENSE and the guide's "Licence and
    # contact". MIT covers this code only; it grants no rights to Fallout or
    # to the Community Edition, which the repository contains none of.
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Every dependency in this workspace is a path dependency to a sibling crate
# with no version key, which cargo-deny reports as a wildcard. That is the
# expected shape for a workspace of local crates, not a finding. Removing it
# would mean either inventing fake versions or deleting the wildcard ban,
# which is the check that actually catches a loose dependency spec.
allow-wildcard-paths = true
highlight = "all"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]