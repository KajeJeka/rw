# PROTECTED file. Changing this needs the owner's approval.

[graph]
all-features = true

[licenses]
# No third party source or code ships in this repository. The allow list is
# deliberately narrow: a new licence needs the owner's approval and a line in
# docs/deps.md stating why (guide: engineering philosophy, "Few dependencies").
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]