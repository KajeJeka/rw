# PROTECTED file. Gate test count floors.
#
# tools/gate.sh step 7 compares the counts the run produced against this file.
# A LOWER number than this file fails the gate. These values may only rise, and
# only with the owner's approval (guide: The gate script).
#
# Phase 1 counts, measured after wave 2. Every gate test carries a claim id and
# an oracle class, so the per-file floors below are the real numbers, not
# estimates.

# Synthetic gate tests. These run in CI and never touch game data.
synthetic_endian 16
synthetic_lzss 18
synthetic_dat 16

# Install gate tests. These are #[ignore = "needs FO1_DATA"] and run only with
# --ignored on a machine where FO1_DATA points at the reference install.
install_archive 12
install_plaintext 6
install_exe_tables 22

# Totals the gate asserts across the six files.
min_synthetic_tests 50
min_install_tests 40

# Tests that live in crates/fo1-tests and run in CI: the harness fingerprint,
# the SHA-256 vectors, and the canaries that reject write index 0 and 4095 and a
# 0x00 prefill. These are the reference decoders, not the code under test, so
# they are counted separately from the gate surface.
min_harness_tests 13